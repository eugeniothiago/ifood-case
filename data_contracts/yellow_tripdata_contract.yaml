version: "1.0.0"
name: yellow_tripdata
status: active
owner:
  team: data-platform
  steward: data-engineering
  contact: data-platform@ifood.com
source:
  system: NYC Taxi and Limousine Commission
  format: parquet
  url_template: https://d37ci6v3ury3vh.cloudfront.net/trip-data/yellow_tripdata_{year}-{month}.parquet
  coverage:
    year: 2023
    months: [1, 2, 3, 4, 5]
storage:
  format: delta
  catalog: nyc_taxi
  bronze_table: nyc_taxi.bronze.yellow_tripdata
  silver_table: nyc_taxi.silver.yellow_tripdata
  gold_table: nyc_taxi.gold.yellow_tripdata
  community_edition_fallback:
    bronze_table: bronze.yellow_tripdata
    silver_table: silver.yellow_tripdata
    gold_table: gold.yellow_tripdata
schema:
  - name: VendorID
    type: int
    nullable: true
    description: Technology provider that provided the record.
  - name: tpep_pickup_datetime
    type: timestamp
    nullable: true
    description: Pickup date and time reported by the taximeter.
  - name: tpep_dropoff_datetime
    type: timestamp
    nullable: true
    description: Dropoff date and time reported by the taximeter.
  - name: passenger_count
    type: double
    nullable: true
    description: Number of passengers in the vehicle.
  - name: trip_distance
    type: double
    nullable: true
    description: Elapsed trip distance in miles.
  - name: RatecodeID
    type: int
    nullable: true
    description: Final rate code in effect at the end of the trip.
  - name: store_and_fwd_flag
    type: string
    nullable: true
    description: Whether the trip record was held in vehicle memory before transmission.
  - name: PULocationID
    type: int
    nullable: true
    description: TLC taxi zone where the meter was engaged.
  - name: DOLocationID
    type: int
    nullable: true
    description: TLC taxi zone where the meter was disengaged.
  - name: payment_type
    type: int
    nullable: true
    description: Numeric payment method identifier.
  - name: fare_amount
    type: double
    nullable: true
    description: Time-and-distance fare calculated by the meter.
  - name: extra
    type: double
    nullable: true
    description: Miscellaneous extras and surcharges.
  - name: mta_tax
    type: double
    nullable: true
    description: MTA tax automatically triggered based on the metered rate.
  - name: tip_amount
    type: double
    nullable: true
    description: Tip amount; credit-card tips are included, cash tips are not.
  - name: tolls_amount
    type: double
    nullable: true
    description: Total tolls paid during the trip.
  - name: improvement_surcharge
    type: double
    nullable: true
    description: Improvement surcharge assessed at the trip start.
  - name: total_amount
    type: double
    nullable: true
    description: Total amount charged to passengers, excluding cash tips.
  - name: congestion_surcharge
    type: double
    nullable: true
    description: Congestion surcharge when applicable.
  - name: Airport_fee
    type: double
    nullable: true
    description: Airport fee when applicable.
  - name: _source_file
    type: string
    nullable: false
    description: Input file path captured by Spark input_file_name.
  - name: _ingestion_timestamp
    type: timestamp
    nullable: false
    description: Timestamp at which the append started.
  - name: _ingestion_date
    type: date
    nullable: false
    description: Calendar date of ingestion for operational auditing.
consumption_schema:
  required_columns:
    - VendorID
    - passenger_count
    - total_amount
    - tpep_pickup_datetime
    - tpep_dropoff_datetime
  gold_derived_columns:
    - name: pickup_date
      type: date
      nullable: false
      description: Calendar date derived from tpep_pickup_datetime for daily partitioning.
constraints:
  - "All five required columns must be present in consumption output."
  - "Gold pickup_date is derived only from tpep_pickup_datetime."
quality_rules:
  - name: required_columns_not_null
    sql_expression: "VendorID IS NULL OR passenger_count IS NULL OR total_amount IS NULL OR tpep_pickup_datetime IS NULL OR tpep_dropoff_datetime IS NULL"
    action: quarantine
  - name: passenger_count_positive
    sql_expression: "passenger_count IS NULL OR passenger_count <= 0"
    action: quarantine
  - name: total_amount_non_negative
    sql_expression: "total_amount IS NULL OR total_amount < 0"
    action: quarantine
  - name: dropoff_after_pickup
    sql_expression: "tpep_pickup_datetime IS NULL OR tpep_dropoff_datetime IS NULL OR tpep_dropoff_datetime <= tpep_pickup_datetime"
    action: quarantine
  - name: pickup_in_case_period
    sql_expression: "tpep_pickup_datetime IS NULL OR tpep_pickup_datetime < TIMESTAMP '2023-01-01' OR tpep_pickup_datetime >= TIMESTAMP '2023-06-01'"
    action: quarantine
partitioning:
  column: pickup_date
  granularity: daily
  rationale: "Daily partitions enable pruning for the May hourly analysis and avoid large monthly partitions while keeping partition count bounded for a five-month case dataset."
sla:
  refresh_frequency: monthly
  expected_availability: "Within 24 hours of TLC publication"
  completeness: "All five source months must be present before a scheduled run is considered complete"
lineage:
  - stage: source
    asset: NYC TLC CloudFront monthly Parquet files
  - stage: bronze
    asset: nyc_taxi.bronze.yellow_tripdata
    operation: "Schema-on-read, append-only Delta, lineage columns"
  - stage: silver
    asset: nyc_taxi.silver.yellow_tripdata
    operation: "Validate required fields, quarantine invalid records, retain consumption columns"
  - stage: gold
    asset: nyc_taxi.gold.yellow_tripdata
    operation: "Daily pickup_date partition, business-ready aggregates and query access"
